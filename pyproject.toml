[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "clifford-network"
version = "0.1.0"
description = "Reproducible complex-valued neural network initialization experiments"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "bokeh>=3.4",
    "h5py>=3.10",
    "holoviews>=1.19",
    "numpy>=2.0",
    "pandas>=2.2",
    "PyYAML>=6.0",
    "torch>=2.4",
    "torchvision>=0.19",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
clifford-network = "clifford_network.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["clifford_network*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
