data:
  features_root: "F:/fastmri_prostate/t2_samples/features"
  manifest_csv: "F:/fastmri_prostate/t2_samples/manifest.csv"
  split_dirs:
    train: "training"
    val: "validation"
    test: "test"
  glob: "*.npy"
  use_manifest: true
  image_size: [320, 320]
  normalization: "sample_rms"
  eps: 1.0e-8

model:
  in_channels: 1
  channels: [16, 32, 64, 128]
  latent_channels: 128
  activation: "modrelu"
  use_bias: true

training:
  batch_size: 4
  num_workers: 0
  epochs: 10
  learning_rate: 2.0e-4
  weight_decay: 1.0e-5
  grad_clip_norm: 1.0
  log_interval: 1
  patience: 5
  device: "auto"
  seed: 7
  output_dir: "runs/complex_t2_autoencoder"
