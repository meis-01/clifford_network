experiment:
  name: synthetic_autoencoder_smoke
  task: autoencoder
  output_dir: results/runs

dataset:
  name: synthetic_autoencoder
  input_size: 32
  train_samples: 96
  validation_samples: 48
  test_samples: 48

model:
  name: complex_mlp_autoencoder
  hidden_size: 32
  depths: [2, 4]
  activation: split_tanh

initialization:
  methods:
    - structured_preserve
    - trabelsi

training:
  epochs: 2
  batch_size: 32
  learning_rate: 0.001
  optimizer: adam
  device: cpu
  seeds: [0]
  save_checkpoint: false

monitoring:
  enabled: true
