experiment:
  name: fastmri_t2_init_depth
  task: autoencoder
  output_dir: results/runs

dataset:
  name: fastmri_t2
  root: data
  max_items: null

model:
  name: complex_mlp_autoencoder
  hidden_size: 512
  depths: [10,100,1000,10000]
  activation: split_tanh

initialization:
  methods:
    - structured_preserve
    - trabelsi
    - xavier
    - he

training:
  epochs: 100
  batch_size: 16
  learning_rate: 0.001
  optimizer: adam
  device: auto
  seeds: [0]

monitoring:
  enabled: true
  saturation_threshold: 0.98
  vanishing_threshold: 0.00001
