experiment:
  name: complex_function_init_depth
  task: regression
  output_dir: results/complex_function

dataset:
  name: function_approximation

  input_dim: 64
  train_samples: 20000
  validation_samples: 5000
  test_samples: 5000
  input_low: -1.0
  input_high: 1.0

model:
  name: complex_mlp
  hidden_size: 10
  depths: [10, 500, 10000]
  activation: split_tanh

initialization:
  gain: 1.2
  methods:
    - structured_preserve
    - trabelsi
    - xavier
    - he

training:
  epochs: 50
  batch_size: 128
  learning_rate: 0.001
  optimizer: adam
  device: auto
  seeds: [0]

monitoring:
  enabled: true
  saturation_threshold: 0.98
  vanishing_threshold: 0.00001