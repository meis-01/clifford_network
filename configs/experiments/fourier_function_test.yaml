experiment:
  name: fourier_function_init_depth
  task: regression
  output_dir: results/fourier_function

dataset:
  name: function_approximation
  input_dim: 5
  n_frequencies: 3
  train_samples: 20000
  validation_samples: 5000
  test_samples: 5000
  input_low: -1.0
  input_high: 1.0
  frequency_low: -3.0
  frequency_high: 3.0

model:
  name: complex_mlp
  hidden_size: 15
  depths: [ 50,10 ]
  activation: split_tanh

initialization:
  # Maximum structured gain, reached linearly at the final complex weight layer.
  # Set to 1.0 to recover the original initializer at every layer.
  gain: 1
  methods:
    - structured_preserve
    - trabelsi
    - xavier
    - he

training:
  epochs: 30
  batch_size: 128
  learning_rate: 0.001
  optimizer: adam
  device: auto
  seeds: [0]


monitoring:
  enabled: true
  saturation_threshold: 0.98
  vanishing_threshold: 0.00001