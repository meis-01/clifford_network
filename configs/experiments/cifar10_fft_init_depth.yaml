experiment:
  name: cifar10_fft_init_depth
  task: classification
  output_dir: results/runs

dataset:
  name: cifar10_fft
  root: data
  download: true
  max_train: null
  max_eval: null

model:
  name: complex_mlp
  hidden_size: 256
  depths: [10,100,1000,10000]
  activation: split_tanh

initialization:
  methods:
    - structured_preserve
    - trabelsi
    - xavier
    - he

training:
  epochs: 100
  batch_size: 128
  learning_rate: 0.001
  optimizer: adam
  device: auto
  seeds: [0] 

monitoring:
  enabled: true
  saturation_threshold: 0.98
  vanishing_threshold: 0.00001
