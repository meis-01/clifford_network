experiment:
  name: cifar10_fft_init_depth
  task: classification
  output_dir: results/run/run_gain_1

dataset:
  name: cifar10_fft
  root: data
  download: true
  max_train: null
  max_eval: null

model:
  name: complex_mlp
  hidden_size: 256
  depths: [1000,10000]
  activation: split_tanh

initialization:
  gain: 1
  methods:
    - structured_preserve
    - trabelsi
    - xavier
    - he

training:
  epochs: 10
  batch_size: 128
  learning_rate: 0.01
  optimizer: adam
  device: auto
  seeds: [0, 1, 2, 3, 4] 

monitoring:
  enabled: true
  saturation_threshold: 0.98
  vanishing_threshold: 0.00001
