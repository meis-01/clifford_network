# ─────────────────────────────────────────────────────────────────
# debug_small.yaml  —  quick-run config for subset testing
#
# Drop this into your configs/ folder and run:
#
#   Single model (xavier init):
#   python -m src.autoencoder.train --config configs/debug_small.yaml
#
#   Full 6-method comparison:
#   python -m src.autoencoder.comparison_train \
#       --config configs/debug_small.yaml \
#       --methods xavier he trabelsi
#
# Changes vs production config:
#   data.max_samples     → caps each split at N files (requires dataset.py patch)
#   model.channels       → much smaller network (fast forward pass)
#   training.epochs      → 5 instead of 50
#   training.patience    → 3 (early stop quickly)
#   training.batch_size  → 4 (fits on CPU or small GPU)
#   training.output_dir  → separate folder so you don't clobber real runs
# ─────────────────────────────────────────────────────────────────

data:
  # keep your real paths — only N samples will actually be loaded
  features_root: /home/mad07/Datasets/Prostate MRI/t2_samples/features
  manifest_csv:  /home/mad07/Datasets/Prostate MRI/t2_samples/manifest.csv
  split_dirs:
    train: training
    val:   validation
    test:  test
  glob: "*.npy"
  use_manifest: true
  image_size: [320, 320]
  normalization: sample_rms

  # ── subset knob ──────────────────────────────────────────────
  # Requires the dataset.py patch below.  Set to null to use all data.
  max_samples: 5000        # 5000 train / 5000 val / 5000 test

model:
  in_channels: 1
  # Tiny encoder: 1→32→64→32  (was 1024→512→256→128→64)
  # Reduces parameters from ~500 M to ~60 M — forward pass is ~10× faster
  channels: [1050, 1050,1050,1050,1050,1050,1050,1050,1050,1050,1050,1050
               ,512,  512,  512,512,512, 512,512,512,512,512,512,512,
                256,256,256,256,256,256,256,256,256,256,256,
                128,128,128,128,128,128,128,128,128,128,128]
  latent_channels: 64
  activation: complextanh
  use_bias: true
  weight_init: xavier      # overridden per-method in comparison_train.py
  image_size: [320, 320]

training:
  batch_size: 128            # safe for CPU; raise to 16-32 if you have a GPU
  num_workers: 0
  epochs: 20
  learning_rate: 2.0e-4
  weight_decay: 1.0e-5
  grad_clip_norm: 1.0
  log_interval: 1
  patience: 3
  device: auto
  seed: 7
  output_dir: runs/debug_small_with_epoch_20