data:
  features_root: /home/mad07/Datasets/Prostate MRI/t2_samples/features
  manifest_csv: /home/mad07/Datasets/Prostate MRI/t2_samples/manifest.csv
  split_dirs:
    train: training
    val: validation
    test: test
  glob: "*.npy"
  use_manifest: true
  image_size: [320, 320]
  normalization: sample_rms
  eps: 1.0e-8

model:
  in_channels: 1
  # Large autoencoder architecture with deep stacking
  channels: [ 1024, 1024,1024,1024,1024,512,512,512,512,512, 256,256, 256,256, 128, 64]
  latent_channels: 64
  activation: complextanh
  use_bias: true
  weight_init: xavier  # Will be overridden during comparison training
  image_size: [320, 320]

training:
  batch_size: 4
  num_workers: 0
  epochs: 100
  learning_rate: 1.0e-4
  weight_decay: 1.0e-5
  grad_clip_norm: 1.0
  log_interval: 5
  patience: 15
  device: auto
  seed: 7
  output_dir: /home/mad07/clifford_network/runs/weight_init_comparison
